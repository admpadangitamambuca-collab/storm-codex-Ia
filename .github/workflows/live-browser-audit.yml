name: Storm production browser smoke (desktop/mobile)
on:
  push:
    branches: [audit/netlify-live-validation-20261116]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2 --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - run: node tools/browser-audit-production.cjs
