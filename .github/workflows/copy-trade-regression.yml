name: Copy Trade regression
on:
  push:
    branches:
      - main
      - fix/copy-trade-monitor-v10-4-20261111
  pull_request:
jobs:
  copy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests (27 inline scripts, Copy monitor)
        run: |
          node tests/copy-trade-smoke.cjs
          node tests/manual_refresh_regression.cjs
          node tests/asset-specialist-regression.cjs
