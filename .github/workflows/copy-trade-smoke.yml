name: Copy Trade smoke tests
on:
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - index.html
      - tests/copy-trade-smoke.cjs
      - tests/v114-lab.test.js
      - storm-lab-v114.js
      - storm-lab-v114.css
      - storm-monitor-status-v115.js
      - storm-runtime-v115.js
      - storm-replay-v115.js
      - storm-monitor-core-v115.js
      - netlify/functions/storm-monitor-scheduled.mjs
      - netlify/functions/b3-live-ohlc.js
      - netlify.toml
      - .github/workflows/copy-trade-smoke.yml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS and Copy Trade simulated operations
        run: node tests/copy-trade-smoke.cjs
      - name: Validate EURUSD/XAUUSD and manual-refresh regressions
        run: |
          node tests/manual_refresh_regression.cjs
          node tests/asset-specialist-regression.cjs
          node tests/outcome-learning-regression.cjs
          node --test tests/v112-smoke.test.js tests/v114-lab.test.js tests/v115-runtime.test.js tests/v115-replay.test.js tests/v115-monitor.test.js
      - name: Validate standalone package generated from current main
        run: |
          mkdir -p dist/smoke
          mkdir -p dist/smoke/netlify/functions
          cp index.html sw.js learning-v108.js b3-indices-v111.js storm-nasdaq-v112.js storm-precision-v112.js storm-b3-quote-v113.js storm-lab-v114.js storm-lab-v114.css storm-monitor-status-v115.js storm-runtime-v115.js storm-replay-v115.js storm-monitor-core-v115.js package.json netlify.toml dist/smoke/
          cp netlify/functions/nasdaq-ohlc.js netlify/functions/b3-quote.js netlify/functions/b3-live-ohlc.js netlify/functions/storm-monitor-scheduled.mjs netlify/functions/storm-status.mjs dist/smoke/netlify/functions/
          (cd dist/smoke && zip -q -r ../storm-smoke.zip .)
          unzip -t dist/storm-smoke.zip
          unzip -p dist/storm-smoke.zip index.html | cmp - index.html
          unzip -p dist/storm-smoke.zip sw.js | cmp - sw.js
          unzip -p dist/storm-smoke.zip storm-nasdaq-v112.js | cmp - storm-nasdaq-v112.js
          unzip -p dist/storm-smoke.zip storm-precision-v112.js | cmp - storm-precision-v112.js
          unzip -p dist/storm-smoke.zip netlify/functions/nasdaq-ohlc.js | cmp - netlify/functions/nasdaq-ohlc.js
          unzip -p dist/storm-smoke.zip storm-lab-v114.js | cmp - storm-lab-v114.js
          unzip -p dist/storm-smoke.zip storm-lab-v114.css | cmp - storm-lab-v114.css
          unzip -p dist/storm-smoke.zip netlify/functions/b3-quote.js | cmp - netlify/functions/b3-quote.js
          unzip -p dist/storm-smoke.zip storm-monitor-status-v115.js | cmp - storm-monitor-status-v115.js
          unzip -p dist/storm-smoke.zip netlify/functions/storm-monitor-scheduled.mjs | cmp - netlify/functions/storm-monitor-scheduled.mjs
