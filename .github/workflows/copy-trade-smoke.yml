name: Copy Trade smoke tests
on:
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - index.html
      - tests/copy-trade-smoke.cjs
      - .github/workflows/copy-trade-smoke.yml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS and Copy Trade simulated operations
        run: node tests/copy-trade-smoke.cjs
      - name: Validate EURUSD/XAUUSD and manual-refresh regressions
        run: |
          node tests/manual_refresh_regression.cjs
          node tests/asset-specialist-regression.cjs
      - name: Validate standalone package generated from current main
        run: |
          mkdir -p dist/smoke
          cp index.html sw.js dist/smoke/
          (cd dist/smoke && zip -q ../storm-smoke.zip index.html sw.js)
          unzip -t dist/storm-smoke.zip
          unzip -p dist/storm-smoke.zip index.html | cmp - index.html
          unzip -p dist/storm-smoke.zip sw.js | cmp - sw.js
