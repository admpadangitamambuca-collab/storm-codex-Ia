name: Copy Trade smoke tests
on:
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - index.html
      - tests/copy-trade-smoke.cjs
      - .github/workflows/copy-trade-smoke.yml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS and Copy Trade simulated operations
        run: node tests/copy-trade-smoke.cjs
      - name: Validate EURUSD/XAUUSD and manual-refresh regressions
        run: |
          node tests/manual_refresh_regression.cjs
          node tests/asset-specialist-regression.cjs
          node tests/outcome-learning-regression.cjs
          node --test tests/v112-smoke.test.js tests/v113-nasdaq-live.test.js
      - name: Validate standalone package generated from current main
        run: |
          mkdir -p dist/smoke
          cp index.html sw.js learning-v108.js b3-indices-v111.js storm-nasdaq-live-v113.js storm-precision-v112.js dist/smoke/
          (cd dist/smoke && zip -q -r ../storm-smoke.zip .)
          unzip -t dist/storm-smoke.zip
          unzip -p dist/storm-smoke.zip index.html | cmp - index.html
          unzip -p dist/storm-smoke.zip sw.js | cmp - sw.js
          unzip -p dist/storm-smoke.zip storm-nasdaq-live-v113.js | cmp - storm-nasdaq-live-v113.js
          unzip -p dist/storm-smoke.zip storm-precision-v112.js | cmp - storm-precision-v112.js
