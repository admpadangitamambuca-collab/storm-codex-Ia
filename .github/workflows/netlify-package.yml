name: Package current Storm Codex IA v11.3
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - 'netlify/**'
      - 'netlify.toml'
      - 'tests/**'
      - '.github/workflows/netlify-package.yml'
  pull_request:
  workflow_dispatch:
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JS engines and regression tests
        run: |
          set -eu
          for file in b3-indices-v111.js learning-v108.js storm-nasdaq-v112.js storm-precision-v112.js storm-b3-quote-v113.js netlify/functions/nasdaq-ohlc.js netlify/functions/b3-quote.js; do
            test -f "$file" || exit 1
            node --check "$file"
          done
          node tests/copy-trade-smoke.cjs
          node tests/manual_refresh_regression.cjs
          node tests/asset-specialist-regression.cjs
          node tests/outcome-learning-regression.cjs
          node --test tests/v112-smoke.test.js
          if [ -f tests/v112-validation.test.js ]; then node --test tests/v112-validation.test.js; fi
          if [ -f tests/v113-audit.test.js ]; then node --test tests/v113-audit.test.js; fi
      - name: Build full-site ZIP with all external scripts and Netlify source functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/netlify/netlify
          cp index.html sw.js learning-v108.js b3-indices-v111.js storm-nasdaq-v112.js storm-precision-v112.js storm-b3-quote-v113.js netlify.toml dist/netlify/
          cp -R netlify/functions dist/netlify/netlify/
          cat > dist/netlify/LEIA_ME.txt <<'EOF'
          STORM CODEX IA 11.3 - PACOTE INTEGRAL
          Todos os motores: Classico, Turbo, Indices, Nasdaq, WIN, WDO, memoria e Copy ficticio.
          Para ativar as Netlify Functions, publique pelo Netlify conectado ao repositorio Git.
          Netlify Drop pode publicar apenas o site estatico, sem executar funcoes do servidor.
          B3 WIN/WDO: a brapi sem login fornece dados de fim de pregao, NAO tempo real.
          Os sinais M1/M5/M15/H1 exigem feed intradiario real, validado e atualizado.
          TradingView gratis para B3 normalmente tem 15 minutos de atraso.
          Turbo XAU: plano tecnico independente do filtro >=US$4 do Classico.
          Copy Trade e ficticio e conserva a regra de confluencia estritamente >83.
          EOF
          (cd dist/netlify && zip -qr9 ../Storm_Codex_IA_v11_3_INTEGRAL_NETLIFY.zip .)
          for path in index.html sw.js learning-v108.js b3-indices-v111.js storm-nasdaq-v112.js storm-precision-v112.js storm-b3-quote-v113.js netlify/functions/nasdaq-ohlc.js netlify/functions/b3-quote.js netlify.toml; do
            unzip -Z1 dist/Storm_Codex_IA_v11_3_INTEGRAL_NETLIFY.zip | grep -Fx "$path"
          done
          unzip -t dist/Storm_Codex_IA_v11_3_INTEGRAL_NETLIFY.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Storm_Codex_IA_v11_3_INTEGRAL_NETLIFY
          path: dist/Storm_Codex_IA_v11_3_INTEGRAL_NETLIFY.zip
