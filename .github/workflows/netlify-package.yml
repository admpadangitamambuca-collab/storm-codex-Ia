name: Publish Netlify ZIP v11.3 (audited)
on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - learning-v108.js
      - b3-indices-v111.js
      - storm-nasdaq-live-v113.js
      - storm-precision-v112.js

      - tests/**
      - README.md
      - .github/workflows/netlify-package.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all active engines, data modules, and adaptive learning
        run: |
          node tests/copy-trade-smoke.cjs
          node tests/manual_refresh_regression.cjs
          node tests/asset-specialist-regression.cjs
          node tests/outcome-learning-regression.cjs
          node --test tests/v112-smoke.test.js tests/v113-nasdaq-live.test.js
          node --check b3-indices-v111.js
          node --check storm-nasdaq-live-v113.js
          node --check storm-precision-v112.js
          node --check learning-v108.js

      - name: Create complete v11.3 Netlify source ZIP
        shell: bash
        run: |
          mkdir -p dist/netlify
          cp index.html sw.js learning-v108.js b3-indices-v111.js storm-nasdaq-live-v113.js storm-precision-v112.js dist/netlify/
          cat > dist/netlify/LEIA_ME.txt <<'EOF'
          STORM CODEX IA 11.3 - FONTE USTEC AO VIVO
          Este ZIP contem index.html e todos os JS ativos da versao.
          Deploy: Netlify Drop ou GitHub. O USTEC usa Biquote REST/SignalR publicos.
          Nao requer funcao Netlify, chave ou login para o feed Nasdaq.
          USTEC e CFD US Tech 100, nao e o indice oficial ^NDX.
          Somente candle fechado e tick fresco liberam analise operacional; sem fallback Yahoo.
          XAU Classico: movimento minimo US$4 em uma vela.
          XAU Turbo: analise independente com ATR/estrutura, inclusive alvos menores.
          Copy Trade: somente SIMULADO; Turbo >83 e OHLC/risco validos.
          Memoria somente local/prospectiva quando navegador estiver aberto.
          Feed USTEC M1/M5/M15/H1 foi observado em execucao de diagnostico; novas sessoes nao sao garantidas.
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          d=Path('dist/netlify')
          html=(d/'index.html').read_text()
          refs=re.findall(r'<script[^>]+src="([^"]+)"',html)
          local=[r for r in refs if not r.startswith(('https://','http://','//'))]
          missing=[r for r in local if not (d/r).is_file()]
          print('JS local:',local)
          if missing: raise SystemExit('Pacote incompleto: '+', '.join(missing))
          required=['index.html','sw.js','learning-v108.js','b3-indices-v111.js',
                    'storm-nasdaq-live-v113.js','storm-precision-v112.js']
          for rel in required:
              if not (d/rel).is_file(): raise SystemExit('Arquivo ausente: '+rel)
          PY
          (cd dist/netlify && zip -9 -q -r ../Storm_Codex_IA_v11_3_USTEC_REALTIME_NETLIFY.zip .)
          unzip -t dist/Storm_Codex_IA_v11_3_USTEC_REALTIME_NETLIFY.zip
          unzip -l dist/Storm_Codex_IA_v11_3_USTEC_REALTIME_NETLIFY.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Storm_Codex_IA_v11_3_USTEC_REALTIME_NETLIFY
          path: dist/Storm_Codex_IA_v11_3_USTEC_REALTIME_NETLIFY.zip
      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=dist/Storm_Codex_IA_v11_3_USTEC_REALTIME_NETLIFY.zip
          if gh release view v11.3-live >/dev/null 2>&1; then
            gh release upload v11.3-live "$FILE" --clobber
          else
            gh release create v11.3-live "$FILE" --target "$GITHUB_SHA" \
              --title "Storm Codex IA 11.3 - USTEC em tempo real" \
              --notes "Inclui todas as dependencias da v11.3. Nasdaq USTEC CFD usa Biquote REST e SignalR gratuitos; quatro timeframes observados no pregão. Feed pode falhar fora do pregão; sinais dependem de vela fechada e tick recente."
          fi
