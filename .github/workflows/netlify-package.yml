name: Publish Netlify ZIP v11.2 (audited)
on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - learning-v108.js
      - b3-indices-v111.js
      - storm-nasdaq-v112.js
      - storm-precision-v112.js
      - netlify/functions/nasdaq-ohlc.js
      - tests/**
      - README.md
      - .github/workflows/netlify-package.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all active engines, data modules, and adaptive learning
        run: |
          node tests/copy-trade-smoke.cjs
          node tests/manual_refresh_regression.cjs
          node tests/asset-specialist-regression.cjs
          node tests/outcome-learning-regression.cjs
          node --test tests/v112-smoke.test.js
          node --check b3-indices-v111.js
          node --check storm-nasdaq-v112.js
          node --check storm-precision-v112.js
          node --check learning-v108.js
          node --check netlify/functions/nasdaq-ohlc.js
      - name: Create complete v11.2 Netlify source ZIP
        shell: bash
        run: |
          mkdir -p dist/netlify/netlify/functions
          cp index.html sw.js learning-v108.js b3-indices-v111.js storm-nasdaq-v112.js storm-precision-v112.js dist/netlify/
          cp netlify/functions/nasdaq-ohlc.js dist/netlify/netlify/functions/
          cat > dist/netlify/LEIA_ME.txt <<'EOF'
          STORM CODEX IA 11.2 - AUDITORIA DE PACOTE
          Este ZIP contem HTML, todos os JS externos e a funcao Netlify Nasdaq.
          Deploy recomendado: conectar repositorio GitHub no Netlify para publicar funcoes.
          Netlify Drop/ZIP estatico normalmente NAO executa Netlify Functions.
          Modo estatico tenta proxy publico cors.dev para Yahoo ^NDX, sem garantia/SLA.
          Nasdaq Yahoo ^NDX pode ter atraso e seus sinais sao bloqueados quando stale.
          XAU Classico: movimento minimo US$4 em uma vela.
          XAU Turbo: analise independente com ATR/estrutura, inclusive alvos menores.
          Copy Trade: somente SIMULADO; Turbo >83 e OHLC/risco validos.
          Memoria somente local/prospectiva quando navegador estiver aberto.
          Fonte de mercado nao foi testada ao vivo pelo teste unitario.
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          d=Path('dist/netlify')
          html=(d/'index.html').read_text()
          refs=re.findall(r'<script[^>]+src="([^"]+)"',html)
          local=[r for r in refs if not r.startswith(('https://','http://','//'))]
          missing=[r for r in local if not (d/r).is_file()]
          print('JS local:',local)
          if missing: raise SystemExit('Pacote incompleto: '+', '.join(missing))
          required=['index.html','sw.js','learning-v108.js','b3-indices-v111.js',
                    'storm-nasdaq-v112.js','storm-precision-v112.js','netlify/functions/nasdaq-ohlc.js']
          for rel in required:
              if not (d/rel).is_file(): raise SystemExit('Arquivo ausente: '+rel)
          PY
          (cd dist/netlify && zip -9 -q -r ../Storm_Codex_IA_v11_2_AUDITADA_NETLIFY.zip .)
          unzip -t dist/Storm_Codex_IA_v11_2_AUDITADA_NETLIFY.zip
          unzip -l dist/Storm_Codex_IA_v11_2_AUDITADA_NETLIFY.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Storm_Codex_IA_v11_2_AUDITADA_NETLIFY
          path: dist/Storm_Codex_IA_v11_2_AUDITADA_NETLIFY.zip
      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=dist/Storm_Codex_IA_v11_2_AUDITADA_NETLIFY.zip
          if gh release view v11.2-audit >/dev/null 2>&1; then
            gh release upload v11.2-audit "$FILE" --clobber
          else
            gh release create v11.2-audit "$FILE" --target "$GITHUB_SHA" \
              --title "Storm Codex IA 11.2 - pacote auditado" \
              --notes "Inclui todas as dependencias da v11.2. Publicacao por Git conecta Netlify Functions; ZIP estatico usa proxy publico sem garantia. Sem dados ao vivo nos testes."
          fi
