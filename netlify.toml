# Storm Codex IA v11.5 - deploy Git required for scheduled Functions and Blobs
[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.12.0"

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "storm-precision-v112.js"]

[functions."storm-monitor-scheduled"]
  schedule = "*/5 * * * *"
